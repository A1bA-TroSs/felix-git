name: test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        env:
          GITLEAKS: "8.30.1"
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m pip install -q git-filter-repo
          cd /tmp
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS}_linux_x64.tar.gz" gitleaks && sudo mv gitleaks /usr/local/bin/
          git config --global user.name "CI" && git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Doctor
        run: python skills/felix-git/scripts/doctor.py || true
      - name: Unit tests
        run: python -m unittest tests.test_scripts -v
